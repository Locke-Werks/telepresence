# macOS release: universal TelePresence.app, signed with Developer ID,
# notarized and stapled, shipped as a .dmg for people and a .zip for the
# updater. Called by release.yml; runnable by hand for a dry run.
name: release-macos

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (default Cargo.toml)
        required: false
        type: string

permissions:
  contents: read

env:
  QT_VERSION: 6.11.3
  GST_VERSION: 1.26.11
  # Pinned so a re-uploaded package on the mirror cannot slip into a release.
  GST_RUNTIME_SHA256: bd6f3ad26126a6db726608f15622efaec383d672daa0a309775785d42c326f9c
  GST_DEVEL_SHA256: 5135a7bc87a75a512f0017aa52e9774d47a5d3eca380210b815d5dc0648bb7bf
  SIGN_IDENTITY: "Developer ID Application: Joseph Hancuff (KVJL9RB8BY)"

jobs:
  macos:
    runs-on: macos-26   # arm64; x86_64 is cross-compiled and lipo'd in
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      # clang_64 is a universal (arm64 + x86_64) build, which the x86_64 half
      # of the binary needs to link against.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Cache GStreamer packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gst-pkg
          key: gstreamer-${{ env.GST_VERSION }}-universal

      # The official framework rather than Homebrew: it is universal, and its
      # libraries are built to be relocated into an app bundle.
      - name: Install GStreamer.framework
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gst-pkg"
          mkdir -p "$dir"
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION"
          for kind in runtime devel; do
            if [ "$kind" = runtime ]; then
              pkg="gstreamer-1.0-$GST_VERSION-universal.pkg"; sum="$GST_RUNTIME_SHA256"
            else
              pkg="gstreamer-1.0-devel-$GST_VERSION-universal.pkg"; sum="$GST_DEVEL_SHA256"
            fi
            [ -f "$dir/$pkg" ] || curl -fsSL --retry 3 -o "$dir/$pkg" "$base/$pkg"
            echo "$sum  $dir/$pkg" | shasum -a 256 -c -
            sudo installer -pkg "$dir/$pkg" -target /
          done
          /Library/Frameworks/GStreamer.framework/Versions/1.0/bin/gst-inspect-1.0 --version

      - name: Build TelePresence.app
        env:
          VERSION: ${{ inputs.version }}
          ARCHS: arm64 x86_64
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || unset VERSION
          bash packaging/macos/build-app.sh

      # Ephemeral keychain, destroyed at the end of the job. login.keychain on
      # a runner is locked with no GUI to unlock it.
      - name: Import Developer ID certificate
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_APP_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          echo "KEYCHAIN=$KEYCHAIN"       >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Without the Apple intermediates the import succeeds, find-identity
          # reports 0 valid identities, and codesign fails
          # errSecInternalComponent.
          for ca in AppleWWDRCAG3 DeveloperIDG2CA AppleRootCA-G3; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" \
              "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done

          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks forever on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign, notarize, staple, package
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || unset VERSION
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          bash packaging/macos/sign-notarize.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/macos/dist/*.dmg
            target/macos/dist/*.zip
          if-no-files-found: error

      - name: Destroy keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
