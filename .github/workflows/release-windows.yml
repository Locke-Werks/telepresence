name: release-windows

# Builds, signs and forges the Windows installer and uploads it as the
# `windows` artifact. Called from release.yml with `secrets: inherit`; the
# signing step reads AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET
# as repository secrets. Same order as packaging/windows/package.ps1, with the
# signing action in place of sign.ps1.

on:
  workflow_call:
    inputs:
      version:
        description: Installer version (leading v is dropped)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (empty reads Cargo.toml)
        type: string
        required: false

permissions:
  contents: read

env:
  # Pinned so a Forge release cannot change what this job produces without
  # someone choosing it. Keep in step with $ForgeVersion in package.ps1.
  # v0.4.0+ is required for pre_install hooks; v0.3.0+ for options/when.
  FORGE_VERSION: v0.4.1
  GST_VERSION: 1.26.10
  QT_VERSION: 6.11.*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'.TrimStart('v')
          if (-not $v) {
            $v = (Select-String Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $cargo = (Select-String Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($v -ne $cargo) {
            # The exe's VERSIONINFO comes from Cargo.toml, the installer's from
            # this input. Allowed, but they will disagree in Explorer.
            "::warning::installer version $v differs from Cargo.toml $cargo"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Install GStreamer
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          $dir = 'C:\gstreamer'
          foreach ($msi in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            Invoke-WebRequest "$base/$msi" -OutFile "$env:RUNNER_TEMP\$msi"
            $sum = ((Invoke-WebRequest "$base/$msi.sha256sum").Content -split '\s+')[0]
            $got = (Get-FileHash "$env:RUNNER_TEMP\$msi" -Algorithm SHA256).Hash
            if ($got -ne $sum.ToUpperInvariant()) { throw "$msi checksum mismatch" }
            # ADDLOCAL=ALL: the default feature set leaves out plugins the app uses.
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "$env:RUNNER_TEMP\$msi", '/qn', 'ADDLOCAL=ALL', "INSTALLDIR=$dir"
            if ($p.ExitCode -ne 0) { throw "msiexec $msi exited $($p.ExitCode)" }
          }
          # The MSI sets this machine-wide, which steps in this job never see.
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$dir\1.0\msvc_x86_64\" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./packaging/windows/stage.ps1 -Phase build

      # Our own binaries, signed BEFORE staging: Forge hashes payload members
      # into the container and extracts them verbatim, so signing the
      # installer does nothing for them. The uninstaller is covered by the
      # signed lwstub.exe from the Forge release.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: target/windows/own
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          # Certificates last three days; without the timestamp the signature
          # stops validating within the week.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify payload signatures
        shell: pwsh
        run: |
          Get-ChildItem target/windows/own -Recurse -Include *.exe, *.dll | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($s.Status)"
            if ($s.Status -ne 'Valid') { throw "$($_.FullName) is $($s.Status)" }
          }

      - name: Stage payload
        shell: pwsh
        run: ./packaging/windows/stage.ps1 -Phase assemble

      # Forge is public; the default token is enough. No PAT.
      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      # No --sign: that flag only works inside the Forge repo.
      - name: Forge the installer
        id: forge
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $icon = (Resolve-Path assets/telepresence.ico).Path -replace '\\', '/'
          (Get-Content packaging/windows/installer.toml -Raw) `
            -replace '(?m)^version\s*=\s*"0\.0\.0"', "version      = `"$v`"" `
            -replace '(?m)^icon\s*=\s*".*"', "icon         = `"$icon`"" |
            Set-Content -Encoding utf8NoBOM target/windows/installer.toml
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = "dist/telepresence-$v-windows-x64-setup.exe"
          ./tools/lwforge.exe build --config target/windows/installer.toml `
            --payload target/windows/stage --stub tools/lwstub.exe --out $out
          if ($LASTEXITCODE -ne 0) { throw "lwforge exited $LASTEXITCODE" }

      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }

          # Signing appended a certificate table after the container; this
          # proves the installer can still read its own payload.
          ./tools/lwforge.exe inspect $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'the signed installer cannot read its own container' }

          # Catches an /O: switch this installer no longer declares.
          $report = & $exe.FullName --check-only /O:desktop_shortcut=off 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) { throw "check-only exited $LASTEXITCODE`n$report" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
