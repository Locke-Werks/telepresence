[package]
name = "tp-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 0.24 tracks GStreamer 1.26; v1_24 keeps us runnable on any 1.24+ runtime.
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }
gst-app = { package = "gstreamer-app", version = "0.24", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.24", features = ["v1_24"] }
gst-audio = { package = "gstreamer-audio", version = "0.24", features = ["v1_24"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
